name: Underworld Inc Android APK

on:
  push:
    branches:
      - underworld-inc-first-build
    paths:
      - "underworld-inc/**"
      - ".github/workflows/underworld-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot and Android SDK
        run: |
          mkdir -p "$HOME/.config" "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/4.3.stable"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lah "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          yes | "$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          ls -lah "$ANDROID_HOME/build-tools"
          ls -lah "$ANDROID_HOME/platforms"

      - name: Import project
        working-directory: underworld-inc
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        working-directory: underworld-inc
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug Android build/underworld-inc.apk
          test -s build/underworld-inc.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: underworld-inc-android
          path: underworld-inc/build/underworld-inc.apk
          if-no-files-found: error

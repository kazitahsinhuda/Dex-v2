name: Underworld Inc Android APK

on:
  push:
    branches:
      - underworld-inc-first-build
    paths:
      - "underworld-inc/**"
      - ".github/workflows/underworld-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot and Android SDK
        run: |
          mkdir -p "$HOME/.config" "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/4.3.stable"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lah "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          yes | "$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          ls -lah "$ANDROID_HOME/build-tools"
          ls -lah "$ANDROID_HOME/platforms"

      - name: Import project
        working-directory: underworld-inc
        run: godot --headless --editor --path . --quit

      - name: Run headless gameplay smoke test
        working-directory: underworld-inc
        run: |
          set -e
          godot --headless --path . --quit-after 120 2>&1 | tee /tmp/underworld-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid set index" /tmp/underworld-smoke.log; then
            echo "Gameplay smoke test reported a script error."
            exit 1
          fi
        shell: bash

      - name: Run story and dealership gameplay tests
        working-directory: underworld-inc
        run: |
          set -e
          godot --headless --path . --script res://tests/gameplay_test.gd 2>&1 | tee /tmp/underworld-gameplay-test.log
          grep -q "UNDERWORLD GAMEPLAY TEST: PASS" /tmp/underworld-gameplay-test.log
        shell: bash

      - name: Export signed debug APK
        working-directory: underworld-inc
        run: |
          set -euxo pipefail
          mkdir -p build "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --verbose --path . --export-debug Android build/underworld-inc.apk
          test -s build/underworld-inc.apk
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose --print-certs build/underworld-inc.apk
          "$ANDROID_HOME/build-tools/33.0.2/aapt" dump badging build/underworld-inc.apk | grep -E "package: name='com.mrotaku.underworldinc'|application-label:'UNDERWORLD INC.'"
          unzip -t build/underworld-inc.apk
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: underworld-inc-android-signed
          path: underworld-inc/build/underworld-inc.apk
          if-no-files-found: error

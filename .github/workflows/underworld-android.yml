name: Underworld Inc Android APK

on:
  push:
    branches:
      - underworld-inc-first-build
    paths:
      - "underworld-inc/**"
      - ".github/workflows/underworld-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export debug APK
        run: |
          mkdir -p underworld-inc/build
          godot --headless --verbose --path underworld-inc --export-debug Android underworld-inc/build/underworld-inc.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: underworld-inc-android
          path: underworld-inc/build/underworld-inc.apk
          if-no-files-found: error
